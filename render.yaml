# Despliegue gratuito en Render (Blueprint). Ver docs/despliegue.md.
# Cada `git push` a main vuelve a desplegar la app automáticamente.
services:
  - type: web
    name: cafe-jaen
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Bolsa de Nueva York en cuatro webs reales (04:15–13:30, hora de Nueva York, de lunes a
      # viernes) y el tipo de cambio del BCRP.
      - key: QUOTATION_SOURCES
        value: '["yahoo","stooq","cnbc","tradingview"]'
      # Dólar en vivo (USD/PEN) cada minuto; si no responde se usa el oficial del BCRP del día
      - key: EXCHANGE_RATE_SOURCES
        value: '["yahoo","tradingview"]'
      # Demostración: precios SINTÉTICOS de cooperativas («Cooperativa JAENPERU sintético A…F»)
      # sobre la bolsa real. Poner "false" y borrarlos en «Equipo» antes del experimento.
      - key: DEMO_COOPERATIVES
        value: "true"
      # Base de datos: se carga a mano en Environment (no se versiona porque lleva contraseña).
      # Con la URL de una base PostgreSQL gratuita (Neon) los datos son permanentes; sin ella,
      # la app usa SQLite dentro del contenedor y los datos se reinician en cada despliegue.
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: keyword
      # Cuenta del equipo (pantallas «Equipo» y «Participantes»): se carga a mano en Environment.
      # Se crea sola al arrancar; nunca se escribe en el repositorio.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Código de verificación: primero por WhatsApp (WhatsApp Business, Meta Cloud API) ...
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # WhatsApp del equipo (9 dígitos): el caficultor pide ahí su código si no le llegó
      - key: TEAM_WHATSAPP
        sync: false
      # ... y si no, por correo (el plan gratis bloquea SMTP: se usa la API de Brevo).
      # EMAIL_SENDER es el correo verificado en Brevo (puede ser de Gmail). Sin ellos, el código
      # solo lo ve el equipo en «Participantes».
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
