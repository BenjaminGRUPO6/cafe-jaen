# Despliegue gratuito en Render (Blueprint). Ver docs/despliegue.md.
# Cada `git push` a main vuelve a desplegar la app automáticamente.
services:
  - type: web
    name: cafe-jaen
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Modo demostración: precio sintético que se mueve todo el día y códigos DEMO-0001…0010.
      # Para precios reales: QUOTATION_SOURCES=["yahoo","stooq"], horario 04:15–13:30 y DEMO_DATA=false
      - key: DEMO_DATA
        value: "true"
      - key: QUOTATION_SOURCES
        value: '["demo"]'
      - key: MARKET_OPENS
        value: "00:00"
      - key: MARKET_CLOSES
        value: "23:59"
      # Base de datos: se carga a mano en Environment (no se versiona porque lleva contraseña).
      # Con la URL de una base PostgreSQL gratuita (Neon) los datos son permanentes; sin ella,
      # la app usa SQLite dentro del contenedor y los datos se reinician en cada despliegue.
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: keyword
      # Cuenta del equipo (pantallas «Equipo» y «Participantes»): se carga a mano en Environment.
      # Se crea sola al arrancar; nunca se escribe en el repositorio.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
